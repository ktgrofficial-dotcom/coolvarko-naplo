name: Napi emlékeztető

on:
  schedule:
    # Óránként 13:07–20:07 UTC között (télen 14–21, nyáron 15–22 budapesti idő).
    # A szkript maga dönti el, hogy elérkezett-e a beállított időpont, és naponta csak egyszer küld.
    - cron: "7 13-20 * * 1-6"
  workflow_dispatch:
    inputs:
      mod:
        description: "proba = próbaüzenet mindenkinek · most = kiküldés azonnal · normal = mint ütemezve"
        required: true
        default: "proba"
        type: choice
        options: [proba, most, normal]

jobs:
  kuldes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix push --no-audit --no-fund
      - run: node push/emlekezteto.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MOD: ${{ github.event.inputs.mod || 'normal' }}
